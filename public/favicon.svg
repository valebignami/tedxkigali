<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>TEDxKigali</title>
  <!-- Self-authored, no external assets: the site background (#0A0A0A) with the
       TED red x mark (#EB0028). Red on black is used as a shape here, never as
       small text, so the body-copy contrast rule does not apply.

       On the case of the x, honestly: it cannot be encoded here. Measuring the
       rendered glyphs of Arial, Verdana, Tahoma, Segoe UI, Arial Black and
       Impact, a lowercase x has an ink box between 0.88 and 1.27 wide over
       tall, a capital X between 0.63 and 1.09 — overlapping ranges, separated
       by about a tenth. What actually tells a reader which one they are looking
       at is size relative to the letters beside it, and an isolated mark on a
       tile has no letters beside it. Two earlier attempts tried to force the
       distinction anyway: one shrank the mark toward a baseline and lost its
       shape entirely at 16x16, the other splayed it to 1.28 and read as a
       divided capital rather than a letter.

       So the bars cross at 44 degrees, giving an ink box of 1.02 — inside the
       lowercase range and outside where most capitals sit — and the mark stays
       two thirds of the tile so it survives the 16x16 a browser tab renders.
       That is the closest this medium gets. If the case has to be unmistakable,
       the answer is the TEDx wordmark rather than a bare x, which is legible
       from 32 pixels up and a blur below it. Verified by rasterising this file
       at 16x16 and looking at it. -->
  <rect width="64" height="64" rx="8" fill="#0A0A0A" />
  <g fill="#EB0028">
    <rect x="8" y="26.5" width="48" height="11" rx="2" transform="rotate(44 32 32)" />
    <rect x="8" y="26.5" width="48" height="11" rx="2" transform="rotate(-44 32 32)" />
  </g>
</svg>
